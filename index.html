<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Live Chat Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    text-align:center;
    padding:40px;
    background:#ffffff10;
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
    font-size:35px;
    margin-bottom:15px;
}

p{
    font-size:18px;
    opacity:.8;
}

button{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    background:#00c853;
    color:#fff;
    transition:.3s;
}

button:hover{
    background:#00e676;
    transform:scale(1.05);
}
</style>

</head>

<body>

<div class="box">
<h1>Welcome</h1>
<p>Need Help? Click the Live Chat icon.</p>

<button onclick="Tawk_API.maximize();">
Open Live Chat
</button>

</div>

<!--Start of Tawk.to Script-->
<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

Tawk_API.onLoad=function(){
    console.log("Tawk Chat Loaded");
};

(function(){
var s1=document.createElement("script"),
s0=document.getElementsByTagName("script")[0];
s1.async=true;
s1.src='https://embed.tawk.to/6a383cdecdcd031d40705c7e/default';
s1.charset='UTF-8';
s1.setAttribute('crossorigin','*');
s0.parentNode.insertBefore(s1,s0);
})();
</script>
<!--End of Tawk.to Script-->

</body>
</html>
